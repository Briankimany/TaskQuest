# ── Provider transport config ──────────────────────────────────────────────
# Transport concerns only. Prompt templates live in llm_prompts.yaml.
# default_model is an OmniRoute combo id. Combos resolve to a provider
# connection whose auth lives server-side in OmniRoute (e.g. the Google
# connection for 'taskquest-judge-google'), so no per-request session id is
# sent — only an optional OMNIROUTE_API_KEY Bearer token.

default_model: taskquest-judge-google
base_url: http://127.0.0.1:20128/v1
api_key_env: OMNIROUTE_API_KEY
timeout: 90.0
retries: 3
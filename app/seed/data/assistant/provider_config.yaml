# ── Provider transport config ──────────────────────────────────────────────
# Transport concerns only. Prompt templates live in llm_prompts.yaml.
# default_model is an OmniRoute combo id. Combos resolve to a provider
# connection whose auth lives server-side in OmniRoute (e.g. the connection
# behind 'free-coders'), so no per-request session id is sent. The gateway
# REQUIRES a Bearer key, read from a platform-aware env var (see
# ai_assistant.py): Windows -> OMNIROUTE_API_KEY, Linux -> OMNIROUTE_TASKQUEST_API_KEY.

default_model: free-coders
base_url: http://127.0.0.1:20128/v1
api_key_env: OMNIROUTE_API_KEY
timeout: 90.0
retries: 3
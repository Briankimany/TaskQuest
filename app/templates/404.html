{% extends 'base2.html' %}

{% block title %}404 — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <h2 style="margin-bottom:0.5rem">Page not found</h2>
        <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('views.dashboard') }}" class="btn-app btn-app-primary">Dashboard</a>
            <a href="mailto:{{ support_mail }}" class="btn-app btn-app-ghost">Contact Support</a>
        </div>
    </div>
</div>
{% endblock %}

<header class="grpg-topbar">
  <!-- Menu -->
  <button class="grpg-icon-btn" aria-label="Open menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Brand -->
  <div class="grpg-topbar-logo">
    <strong>REAL LIFE RPG</strong>
    <small>Balance. Discipline. Growth.</small>
  </div>

  <div class="grpg-divider"></div>

  <!-- Streak -->
  <div class="grpg-stat-block">
    <span class="grpg-stat-value" style="color:var(--accent-fcs)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2s4 5 4 8a4 4 0 0 1-8 0c0-3 4-8 4-8z"/><path d="M8.5 14a4.2 4.2 0 0 0 7 0c-.4 2.4-2.2 4-3.5 5-1.3-1-3.1-2.6-3.5-5z"/></svg>
      {{ streak }}
    </span>
    <span class="grpg-stat-label">STREAK</span>
    <span class="grpg-stat-label">BEST {{ streak_best }}</span>
  </div>

  <!-- DCP -->
  <div class="grpg-stat-block">
    <span class="grpg-stat-value" style="color:var(--accent-dsc)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/></svg>
      {{ garden_health.discipline }}
    </span>
    <span class="grpg-stat-label">DCP</span>
    <span class="grpg-stat-label">DISCIPLINE</span>
  </div>

  <div class="grpg-topbar-spacer"></div>

  <!-- Level Ring (centerpiece, overflows header top/bottom) -->
  <div class="grpg-level-ring">
    <svg width="80" height="80" viewBox="0 0 76 76" aria-hidden="true">
      <defs>
        <linearGradient id="grpg-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E8578F"/>
          <stop offset="50%" stop-color="#F0A830"/>
          <stop offset="100%" stop-color="#3AB6F0"/>
        </linearGradient>
      </defs>
      <circle cx="38" cy="38" r="32" fill="none" stroke="rgba(150,180,200,0.14)" stroke-width="5"/>
      <circle cx="38" cy="38" r="32" fill="none" stroke="url(#grpg-ring-grad)" stroke-width="5"
        stroke-dasharray="201.06" stroke-dashoffset="{{ ring_offset }}" stroke-linecap="round" class="grpg-ring-progress"/>
      <circle cx="38" cy="38" r="24" fill="rgba(7,12,19,0.55)" stroke="rgba(150,180,200,0.16)"/>
    </svg>
    <div class="grpg-level-ring-text">
      {{ level }}
      <small>LEVEL</small>
    </div>
    <span class="sr-only">Level {{ level }}, {{ xp_pct }}% to next level</span>
  </div>

  <div class="grpg-topbar-spacer"></div>

  <!-- XP Bar -->
  <div class="grpg-xp-block">
    <div class="grpg-xp-top">
      <span class="grpg-xp-label">XP</span>
      <span class="grpg-xp-text grpg-xp-value">{{ xp_current }} / {{ xp_next }}</span>
    </div>
    <div class="grpg-xp-bar-wrap">
      <div class="grpg-xp-bar" role="progressbar" aria-valuenow="{{ xp_current }}" aria-valuemin="0" aria-valuemax="{{ xp_next }}" aria-label="Experience points progress">
        <div class="grpg-xp-bar-fill" style="width:{{ (xp_current / (xp_next if xp_next > 0 else 1) * 100)|round(1) }}%"></div>
      </div>
      <span class="grpg-xp-pct">{{ xp_pct }}%</span>
    </div>
  </div>

  <div class="grpg-divider"></div>

  <!-- Secondary nav (Today, Map, Journal, Stats) -->
  <nav class="grpg-topbar-nav" aria-label="Secondary navigation">
    <a href="{{ url_for('views.dashboard') }}" class="grpg-nav-btn grpg-topbar-secondary {{ 'grpg-nav-active' if request.endpoint == 'views.dashboard' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M12 13.5l1.8 1.8L17 12"/></svg>
      Today
    </a>
    <a href="{{ url_for('views.timetable') }}" class="grpg-nav-btn grpg-topbar-secondary {{ 'grpg-nav-active' if request.endpoint == 'views.timetable' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      Map
    </a>
    <a href="{{ url_for('views.journal') }}" class="grpg-nav-btn grpg-topbar-secondary {{ 'grpg-nav-active' if request.endpoint == 'views.journal' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Journal
    </a>
    <a href="{{ url_for('views.stats') }}" class="grpg-nav-btn grpg-topbar-secondary {{ 'grpg-nav-active' if request.endpoint == 'views.stats' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Stats
    </a>
  </nav>

  <!-- Profile -->
  <a href="{{ url_for('views.profile') }}" class="grpg-avatar-link" aria-label="{{ user.username }}'s profile">
    <img src="{{ url_for('static', filename='assets/img/favicon.ico') }}" alt="" class="grpg-avatar">
    <svg class="grpg-avatar-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </a>
</header>

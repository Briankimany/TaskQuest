<header class="grpg-topbar">
  <!-- Hamburger -->
  <button class="grpg-icon-btn" aria-label="Open menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Logo -->
  <div class="grpg-topbar-logo">
    <strong>REAL LIFE RPG</strong>
    <small>{{ player.title }}</small>
  </div>

  <div class="grpg-divider"></div>

  <!-- Streak -->
  <div class="grpg-stat-block">
    <span class="grpg-stat-value" style="color:var(--accent-fcs)">&#x1F525; {{ streak }}</span>
    <span class="grpg-stat-label">STREAK</span>
    <span class="grpg-stat-label">BEST {{ streak_best }}</span>
  </div>

  <!-- DCP -->
  <div class="grpg-stat-block">
    <span class="grpg-stat-value" style="color:var(--accent-dsc)">&#x1F6E1; {{ garden_health.discipline }}</span>
    <span class="grpg-stat-label">DCP</span>
    <span class="grpg-stat-label">DISCIPLINE</span>
  </div>

  <div class="grpg-divider"></div>

  <!-- Level Ring -->
  <div class="grpg-level-ring">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="20" fill="none" stroke="var(--bg-panel-raised)" stroke-width="4"/>
      <circle cx="24" cy="24" r="20" fill="none" stroke="var(--accent)" stroke-width="4"
        stroke-dasharray="125.66" stroke-dashoffset="{{ ring_offset }}" stroke-linecap="round"/>
    </svg>
    <div class="grpg-level-ring-text">
      {{ level }}
      <small>LEVEL</small>
    </div>
    <span class="sr-only">Level {{ level }}, {{ xp_pct }}% to next level</span>
  </div>

  <!-- XP Bar -->
  <div class="grpg-xp-block">
    <span class="grpg-xp-text grpg-xp-value">{{ xp_current }} / {{ xp_next }}</span>
    <div class="grpg-xp-bar" role="progressbar" aria-valuenow="{{ xp_current }}" aria-valuemin="0" aria-valuemax="{{ xp_next }}" aria-label="Experience points progress">
      <div class="grpg-xp-bar-fill" style="width:{{ (xp_current / (xp_next if xp_next > 0 else 1) * 100)|round(1) }}%"></div>
    </div>
  </div>

  <div class="grpg-divider"></div>

  <!-- Secondary nav (Map, Journal, Stats — muted, no active state) -->
  <nav class="grpg-topbar-nav" aria-label="Secondary navigation">
    <a href="{{ url_for('views.timetable') }}" class="grpg-nav-btn grpg-topbar-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      Map
    </a>
    <a href="#" class="grpg-nav-btn grpg-topbar-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Journal
    </a>
    <a href="{{ url_for('views.stats') }}" class="grpg-nav-btn grpg-topbar-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Stats
    </a>
  </nav>

  <!-- Avatar -->
  <a href="{{ url_for('views.profile') }}" class="grpg-avatar-link" aria-label="{{ user.username }}'s profile">
    <img src="{{ url_for('static', filename='assets/img/favicon.ico') }}" alt="{{ user.username }}'s avatar" class="grpg-avatar">
  </a>
</header>

{% extends 'base2.html' %}

{% block title %}Error — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">!</div>
        <h2 style="margin-bottom:0.5rem">Something went wrong</h2>
        <p class="error-message">An unexpected error occurred. We're looking into it.</p>
        <div class="text-muted-app font-mono mb-4" style="font-size:0.8rem">{{ exception }}</div>
        <a href="{{ url_for('views.index') }}" class="btn-app btn-app-primary">Back to Home</a>
    </div>
</div>
{% endblock %}
